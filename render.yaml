services:
  - type: web
    name: fieldnote-trial-evidence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://d6-80758-chetankushwaha.github.io
